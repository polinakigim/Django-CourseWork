{% extends 'mailing/base.html' %}
{% block content %}

<div class="container">
    <div class="row text-center">
        {% for recipient in object_list %}
        <div class="col-4">
            <div class="card mb-4 box-shadow">

                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ recipient.full_name }}</h4>
                </div>
                <div class="card-body">
                    <h5 class="card-title">{{ recipient.email }}</h5>
                    <p class="text-muted">{{ recipient.comment|truncatechars:100 }}</p>

                    <a href="{% url 'mailing:recipient_detail' recipient.pk %}">
                        <button type="button" class="btn btn-outline-primary">Подробнее</button>
                        <a href="{% url 'mailing:recipient_update' recipient.pk %}">
                            <button type="button" class="btn btn-outline-primary">Редактировать</button>
                        </a>
                        <a href="{% url 'mailing:recipient_delete' recipient.pk %}">
                            <button type="button" class="btn btn-outline-danger">Удалить</button>
                        </a>

                </div>

            </div>
        </div>
        {% empty %}
        <p class="text-center">Нет получателей рассылки.</p>
        {% endfor %}
    </div>
</div>

{% endblock content %}
