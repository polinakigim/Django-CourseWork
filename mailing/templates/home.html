{% extends "base.html" %}

{% block content %}
<div class="container text-center mt-5">
    <h2 class="mb-4">Статистика рассылок</h2>
    
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Всего рассылок</h5>
                    <p class="display-4">{{ total_mailings }}</p>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Активные рассылки</h5>
                    <p class="display-4 text-success">{{ active_mailings }}</p>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Уникальных получателей</h5>
                    <p class="display-4 text-primary">{{ unique_recipients }}</p>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
    </div>
</div>
{% endblock %}
